<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <h1 data-i18n="h1"></h1>
            <p id="domain" data-i18n="domain"></p>
            
            <div class="license">
                <p data-i18n="licenseIntro"></p>
                <ul>
                    <li data-i18n="privacy1"></li>
                    <li data-i18n="privacy2"></li>
                    <li data-i18n="privacy3"></li>
                    <li data-i18n="privacy4"></li>
                    <li data-i18n="privacy5"></li>
                </ul>
            </div>

            <p class="question" data-i18n="question"></p>
            
            <div class="buttons">
                <button id="back" data-i18n="backButton"></button>
                <button id="continue" class="danger" data-i18n="continueButton"></button>
            </div>
        </div>
    </main>
    <script src="blocked.js"></script>
</body>
</html>
