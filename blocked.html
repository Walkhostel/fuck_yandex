<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доступ заблокирован</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <div class="card">

      <h1>Доступ к яндексу ограничен</h1>

      <p id="domain"></p>

      <h2>Условия продолжения</h2>

      <div class="license">
        <p>
          Перед переходом ознакомьтесь с условиями:
        </p>

        <ul>            
          <li>ОЧЕНЬ СТРАШНАЯ ЛИЦЕНЗИЯ ЯДЕКСА(!!!ВСТАВИТЬ НАСТОЯЩИЕ!!!)</li>
        </ul>
      </div>

      <p class="question">
        Точно хотите продолжить?
      </p>

      <div class="buttons">
        <button id="back">
          Вернуться
        </button>

        <button id="continue" class="danger">
          Продолжить
        </button>
      </div>

    </div>
  </main>

  <script src="blocked.js"></script>
</body>
</html>
